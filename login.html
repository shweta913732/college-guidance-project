<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — College Guidance</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;background:#050d1a;min-height:100vh;display:flex;flex-direction:column;}

/* Navbar */
.navbar{display:flex;align-items:center;justify-content:space-between;padding:16px 36px;background:rgba(5,13,26,0.92);border-bottom:0.5px solid rgba(255,255,255,0.08);position:sticky;top:0;z-index:99;backdrop-filter:blur(12px);}
.nav-brand{display:flex;align-items:center;gap:10px;color:#fff;font-size:18px;font-weight:600;text-decoration:none;}
.nav-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;}
.nav-links a{color:rgba(255,255,255,0.6);font-size:14px;padding:8px 16px;border-radius:8px;text-decoration:none;transition:all 0.2s;}
.nav-links a:hover{color:#fff;background:rgba(255,255,255,0.08);}

/* Page layout */
.page-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;position:relative;overflow:hidden;}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;}

/* Card */
.card{position:relative;z-index:2;background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.1);border-radius:24px;padding:44px 40px;width:100%;max-width:440px;backdrop-filter:blur(20px);}

.card-icon{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;margin:0 auto 20px;}
.card h2{font-size:26px;font-weight:700;color:#fff;text-align:center;margin-bottom:6px;}
.card-sub{font-size:14px;color:rgba(255,255,255,0.42);text-align:center;margin-bottom:32px;}

/* Form */
.form-group{margin-bottom:18px;}
.form-group label{display:block;font-size:13px;color:rgba(255,255,255,0.6);margin-bottom:8px;font-weight:500;}
.input-wrap{position:relative;}
.input-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.3);font-size:18px;}
.input-wrap input{width:100%;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.12);color:#fff;border-radius:11px;padding:13px 16px 13px 44px;font-size:14px;outline:none;transition:border-color 0.2s,background 0.2s;}
.input-wrap input::placeholder{color:rgba(255,255,255,0.25);}
.input-wrap input:focus{border-color:#3b82f6;background:rgba(59,130,246,0.08);}
.show-pass{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,0.3);cursor:pointer;font-size:18px;padding:0;}
.show-pass:hover{color:rgba(255,255,255,0.7);}

.forgot{display:block;text-align:right;font-size:13px;color:#60a5fa;text-decoration:none;margin-top:6px;}
.forgot:hover{color:#93c5fd;}

.btn-submit{width:100%;padding:14px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;border:none;border-radius:11px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity 0.2s,transform 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;}
.btn-submit:hover{opacity:0.88;transform:translateY(-2px);}

.divider{display:flex;align-items:center;gap:12px;margin:24px 0;}
.divider::before,.divider::after{content:'';flex:1;height:0.5px;background:rgba(255,255,255,0.1);}
.divider span{font-size:13px;color:rgba(255,255,255,0.3);}

.social-btns{display:flex;gap:12px;}
.btn-social{flex:1;padding:11px;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.7);border-radius:10px;font-size:13px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-social:hover{background:rgba(255,255,255,0.1);color:#fff;}

.register-link{text-align:center;margin-top:24px;font-size:14px;color:rgba(255,255,255,0.4);}
.register-link a{color:#60a5fa;text-decoration:none;font-weight:600;}
.register-link a:hover{color:#93c5fd;}

/* Footer */
footer{background:#020810;padding:20px 36px;border-top:0.5px solid rgba(255,255,255,0.06);text-align:center;}
footer span{font-size:13px;color:rgba(255,255,255,0.28);}
</style>
</head>
<body>

<nav class="navbar">
  <a class="nav-brand" href="index.html">
    <div class="nav-logo"><i class="ti ti-school" aria-hidden="true"></i></div>
    College Guidance
  </a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="college.html">Colleges</a>
    <a href="register.html">Register</a>
  </div>
</nav>

<div class="page-wrap">
  <canvas id="particles"></canvas>

  <div class="card">
    <div class="card-icon"><i class="ti ti-user" aria-hidden="true"></i></div>
    <h2>Welcome Back</h2>
    <p class="card-sub">Login to your account to continue your journey</p>

    <form action="login.php" method="POST">

      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrap">
          <i class="ti ti-mail" aria-hidden="true"></i>
          <input type="email" name="email" placeholder="Enter your email" required>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <i class="ti ti-lock" aria-hidden="true"></i>
          <input type="password" name="password" id="passInput" placeholder="Enter your password" required>
          <button type="button" class="show-pass" onclick="togglePass()">
            <i class="ti ti-eye" id="eyeIcon" aria-hidden="true"></i>
          </button>
        </div>
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <button type="submit" class="btn-submit">
        <i class="ti ti-login" aria-hidden="true"></i> Login to Account
      </button>

    </form>

    <div class="divider"><span>or continue with</span></div>
    <div class="social-btns">
      <button class="btn-social"><i class="ti ti-brand-google" aria-hidden="true"></i> Google</button>
      <button class="btn-social"><i class="ti ti-brand-github" aria-hidden="true"></i> GitHub</button>
    </div>

    <div class="register-link">
      Don't have an account? <a href="register.html">Register Free</a>
    </div>
  </div>
</div>

<footer>
  <span>© 2026 College Admission Guidance System. All Rights Reserved.</span>
</footer>

<script>
/* Particle background */
const canvas=document.getElementById('particles'),ctx=canvas.getContext('2d');
let W,H,parts=[];
function resize(){W=canvas.offsetWidth;H=canvas.offsetHeight;canvas.width=W;canvas.height=H;}
resize();window.addEventListener('resize',resize);
function P(){this.x=Math.random()*W;this.y=Math.random()*H;this.r=Math.random()*1.4+0.4;this.vx=(Math.random()-.5)*.4;this.vy=(Math.random()-.5)*.4;this.alpha=Math.random()*.4+.1;this.c=['#3b82f6','#8b5cf6','#06b6d4'][Math.floor(Math.random()*3)];}
for(let i=0;i<70;i++)parts.push(new P());
function draw(){ctx.clearRect(0,0,W,H);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.c;ctx.globalAlpha=p.alpha;ctx.fill();});parts.forEach((p,i)=>{for(let j=i+1;j<parts.length;j++){const q=parts[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<100){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle=`rgba(99,102,241,${0.1*(1-d/100)})`;ctx.globalAlpha=1;ctx.lineWidth=.5;ctx.stroke();}}});requestAnimationFrame(draw);}
draw();

function togglePass(){
  const inp=document.getElementById('passInput'),ic=document.getElementById('eyeIcon');
  if(inp.type==='password'){inp.type='text';ic.className='ti ti-eye-off';}
  else{inp.type='password';ic.className='ti ti-eye';}
}
</script>
</body>
</html>
