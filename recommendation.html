<!DOCTYPE html>
<html>
<head>
<title>College Recommendation</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

<h2 class="text-center mb-4">
College Recommendation System
</h2>

<div class="row justify-content-center">

<div class="col-md-6">

<input type="number" id="marks"
class="form-control mb-3"
placeholder="Enter Your Marks">

<button class="btn btn-primary w-100"
onclick="recommendCollege()">
Get Recommendation
</button>

<h4 class="mt-4" id="result"></h4>

</div>

</div>

</div>

<script>

function recommendCollege(){

let marks =
document.getElementById("marks").value;

let result =
document.getElementById("result");

if(marks >= 180){
result.innerHTML =
"Recommended: ABC Engineering College";
}
else if(marks >= 150){
result.innerHTML =
"Recommended: XYZ Institute of Technology";
}
else{
result.innerHTML =
"Recommended: DEF College of Engineering";
}

}

</script>

</body>
</html>
