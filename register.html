<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — College Guidance</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;background:#050d1a;min-height:100vh;display:flex;flex-direction:column;}

.navbar{display:flex;align-items:center;justify-content:space-between;padding:16px 36px;background:rgba(5,13,26,0.92);border-bottom:0.5px solid rgba(255,255,255,0.08);position:sticky;top:0;z-index:99;backdrop-filter:blur(12px);}
.nav-brand{display:flex;align-items:center;gap:10px;color:#fff;font-size:18px;font-weight:600;text-decoration:none;}
.nav-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;}
.nav-links a{color:rgba(255,255,255,0.6);font-size:14px;padding:8px 16px;border-radius:8px;text-decoration:none;transition:all 0.2s;}
.nav-links a:hover{color:#fff;background:rgba(255,255,255,0.08);}

.page-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;position:relative;overflow:hidden;}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;}

.card{position:relative;z-index:2;background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.1);border-radius:24px;padding:44px 40px;width:100%;max-width:480px;backdrop-filter:blur(20px);}

.card-icon{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;margin:0 auto 20px;}
.card h2{font-size:26px;font-weight:700;color:#fff;text-align:center;margin-bottom:6px;}
.card-sub{font-size:14px;color:rgba(255,255,255,0.42);text-align:center;margin-bottom:32px;}

/* Progress steps */
.steps{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:32px;}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;}
.step-circle{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;border:0.5px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.35);background:rgba(255,255,255,0.04);transition:all 0.3s;}
.step-circle.active{background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-color:transparent;color:#fff;}
.step-circle.done{background:rgba(16,185,129,0.2);border-color:rgba(16,185,129,0.4);color:#34d399;}
.step-label{font-size:11px;color:rgba(255,255,255,0.3);}
.step-line{flex:1;height:0.5px;background:rgba(255,255,255,0.1);margin-bottom:18px;}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:13px;color:rgba(255,255,255,0.6);margin-bottom:8px;font-weight:500;}
.input-wrap{position:relative;}
.input-wrap i.icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.3);font-size:18px;}
.input-wrap input,.input-wrap select{width:100%;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.12);color:#fff;border-radius:11px;padding:13px 16px 13px 44px;font-size:14px;outline:none;transition:border-color 0.2s,background 0.2s;appearance:none;}
.input-wrap input::placeholder{color:rgba(255,255,255,0.25);}
.input-wrap input:focus,.input-wrap select:focus{border-color:#3b82f6;background:rgba(59,130,246,0.08);}
.input-wrap select option{background:#0d1b2e;color:#fff;}

/* Password strength */
.strength-bar{height:4px;border-radius:4px;background:rgba(255,255,255,0.08);margin-top:8px;overflow:hidden;}
.strength-fill{height:100%;border-radius:4px;width:0%;transition:width 0.3s,background 0.3s;}
.strength-label{font-size:11px;margin-top:5px;color:rgba(255,255,255,0.35);}

/* Marks range */
.marks-wrap{position:relative;}
.marks-wrap input[type="number"]{padding-right:60px;}
.marks-badge{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:12px;padding:3px 9px;border-radius:6px;font-weight:600;}

.terms{display:flex;align-items:flex-start;gap:10px;margin:18px 0;}
.terms input[type="checkbox"]{width:16px;height:16px;margin-top:2px;accent-color:#3b82f6;cursor:pointer;flex-shrink:0;}
.terms label{font-size:13px;color:rgba(255,255,255,0.45);line-height:1.5;cursor:pointer;}
.terms label a{color:#60a5fa;text-decoration:none;}

.btn-submit{width:100%;padding:14px;background:linear-gradient(135deg,#10b981,#3b82f6);color:#fff;border:none;border-radius:11px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity 0.2s,transform 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-submit:hover{opacity:0.88;transform:translateY(-2px);}

.login-link{text-align:center;margin-top:22px;font-size:14px;color:rgba(255,255,255,0.4);}
.login-link a{color:#60a5fa;text-decoration:none;font-weight:600;}
.login-link a:hover{color:#93c5fd;}

/* Benefits strip */
.benefits{display:flex;justify-content:center;gap:20px;margin-bottom:28px;flex-wrap:wrap;}
.benefit{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,0.4);}
.benefit i{color:#34d399;font-size:14px;}

footer{background:#020810;padding:20px 36px;border-top:0.5px solid rgba(255,255,255,0.06);text-align:center;}
footer span{font-size:13px;color:rgba(255,255,255,0.28);}
</style>
</head>
<body>

<nav class="navbar">
  <a class="nav-brand" href="index.html">
    <div class="nav-logo"><i class="ti ti-school" aria-hidden="true"></i></div>
    College Guidance
  </a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="college.html">Colleges</a>
    <a href="login.html">Login</a>
  </div>
</nav>

<div class="page-wrap">
  <canvas id="particles"></canvas>

  <div class="card">
    <div class="card-icon"><i class="ti ti-user-plus" aria-hidden="true"></i></div>
    <h2>Create Account</h2>
    <p class="card-sub">Join 10,000+ students finding their dream college</p>

    <div class="benefits">
      <div class="benefit"><i class="ti ti-check" aria-hidden="true"></i> Free forever</div>
      <div class="benefit"><i class="ti ti-check" aria-hidden="true"></i> AI recommendations</div>
      <div class="benefit"><i class="ti ti-check" aria-hidden="true"></i> Instant eligibility</div>
    </div>

    <form action="register.php" method="POST">

      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <div class="input-wrap">
            <i class="ti ti-user icon" aria-hidden="true"></i>
            <input type="text" name="first_name" placeholder="First name" required>
          </div>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <div class="input-wrap">
            <i class="ti ti-user icon" aria-hidden="true"></i>
            <input type="text" name="last_name" placeholder="Last name" required>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrap">
          <i class="ti ti-mail icon" aria-hidden="true"></i>
          <input type="email" name="email" placeholder="Enter your email" required>
        </div>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <div class="input-wrap">
          <i class="ti ti-phone icon" aria-hidden="true"></i>
          <input type="tel" name="phone" placeholder="Enter your phone number">
        </div>
      </div>

      <div class="form-group">
        <label>Preferred Course</label>
        <div class="input-wrap">
          <i class="ti ti-book icon" aria-hidden="true"></i>
          <select name="course">
            <option value="">Select preferred course</option>
            <option value="CSE">CSE — Computer Science Engineering</option>
            <option value="IT">IT — Information Technology</option>
            <option value="ECE">ECE — Electronics & Communication</option>
            <option value="EEE">EEE — Electrical & Electronics</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>12th Marks (out of 200)</label>
        <div class="input-wrap marks-wrap">
          <i class="ti ti-certificate icon" aria-hidden="true"></i>
          <input type="number" name="marks" id="marksInput" placeholder="Enter your 12th marks" min="0" max="200" oninput="updateMarks(this.value)" required>
          <span class="marks-badge" id="marksBadge" style="background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.4);">/ 200</span>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <i class="ti ti-lock icon" aria-hidden="true"></i>
          <input type="password" name="password" id="passInput" placeholder="Create a strong password" oninput="checkStrength(this.value)" required>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <div class="strength-label" id="strengthLabel">Enter a password</div>
      </div>

      <div class="terms">
        <input type="checkbox" id="terms" required>
        <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
      </div>

      <button type="submit" class="btn-submit">
        <i class="ti ti-user-check" aria-hidden="true"></i> Create My Account
      </button>

    </form>

    <div class="login-link">
      Already have an account? <a href="login.html">Login here</a>
    </div>
  </div>
</div>

<footer>
  <span>© 2026 College Admission Guidance System. All Rights Reserved.</span>
</footer>

<script>
/* Particles */
const canvas=document.getElementById('particles'),ctx=canvas.getContext('2d');
let W,H,parts=[];
function resize(){W=canvas.offsetWidth;H=canvas.offsetHeight;canvas.width=W;canvas.height=H;}
resize();window.addEventListener('resize',resize);
function P(){this.x=Math.random()*W;this.y=Math.random()*H;this.r=Math.random()*1.4+0.4;this.vx=(Math.random()-.5)*.4;this.vy=(Math.random()-.5)*.4;this.alpha=Math.random()*.4+.1;this.c=['#3b82f6','#10b981','#8b5cf6'][Math.floor(Math.random()*3)];}
for(let i=0;i<70;i++)parts.push(new P());
function draw(){ctx.clearRect(0,0,W,H);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.c;ctx.globalAlpha=p.alpha;ctx.fill();});parts.forEach((p,i)=>{for(let j=i+1;j<parts.length;j++){const q=parts[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<100){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle=`rgba(99,102,241,${0.1*(1-d/100)})`;ctx.globalAlpha=1;ctx.lineWidth=.5;ctx.stroke();}}});requestAnimationFrame(draw);}
draw();

/* Marks badge */
function updateMarks(v){
  const b=document.getElementById('marksBadge');
  const n=parseInt(v);
  b.textContent=v?v+'/200':'/ 200';
  if(n>=180){b.style.background='rgba(16,185,129,0.2)';b.style.color='#34d399';}
  else if(n>=150){b.style.background='rgba(59,130,246,0.2)';b.style.color='#60a5fa';}
  else if(n>=100){b.style.background='rgba(245,158,11,0.2)';b.style.color='#fbbf24';}
  else{b.style.background='rgba(239,68,68,0.2)';b.style.color='#fca5a5';}
}

/* Password strength */
function checkStrength(v){
  const fill=document.getElementById('strengthFill'),label=document.getElementById('strengthLabel');
  let score=0;
  if(v.length>=8)score++;
  if(/[A-Z]/.test(v))score++;
  if(/[0-9]/.test(v))score++;
  if(/[^A-Za-z0-9]/.test(v))score++;
  const configs=[
    {w:'0%',c:'',t:'Enter a password'},
    {w:'25%',c:'#ef4444',t:'Weak'},
    {w:'50%',c:'#f97316',t:'Fair'},
    {w:'75%',c:'#eab308',t:'Good'},
    {w:'100%',c:'#22c55e',t:'Strong!'},
  ];
  const cfg=configs[score];
  fill.style.width=cfg.w;fill.style.background=cfg.c;label.textContent=cfg.t;label.style.color=cfg.c||'rgba(255,255,255,0.35)';
}
</script>
</body>
</html>
